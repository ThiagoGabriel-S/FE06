<!DOCTYPE html>
<html lang="en">
<head>

<style>

    form {
    padding: 20px;
    border: 2px solid #cbd5e1;
    max-width: 320px;
    }
    
    label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
    }
    
    input {
    width: 95%;
    padding: 8px;
    margin-top: 4px;
    border: 1px solid #94a3b8;
    }
    
    button {
    margin-top: 16px;
    background-color: #7c3aed;
    color: white;
    border: none;
    padding: 10px 22px;
    }
</style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>Nome</label>
        <input type="text">
    
        <label>E-mail</label>
        <input type="email">
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
